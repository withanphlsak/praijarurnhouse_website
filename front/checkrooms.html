    <script>
        // setting
        const SUPABASE_URL = 'https://lttlapkgjfurwgzrfsjw.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_oVzeeoFMXUBW47nCy-IpIQ_r8cKYVdP';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ฟังก์ชันแสดง/ซ่อนเมนูในมือถือ
        function myFunction() {
            let x = document.getElementById("nav-links");
            x.classList.toggle("show");
        }

        // ฟังก์ชันดึงข้อมูลห้อง
        async function fetchRooms() {
            try {
                const { data: rooms, error } = await _supabase
                    .from('rooms')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;
                renderRooms(rooms);
            } catch (err) {
                console.error("เชื่อมต่อ Supabase ไม่ได้:", err);
                document.getElementById('room-grid').innerHTML = '<p class="error-text">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</p>';
            }
        }

        // ฟังก์ชันสำหรับแสดงข้อมูลห้องในรูปแบบgrid
        function renderRooms(rooms) {
            const grid = document.getElementById('room-grid');
            grid.innerHTML = '';

            rooms.forEach(room => {
                const isAvailable = room.status === 'available';
                const statusClass = isAvailable ? 'status-available' : 'status-occupied';
                const statusText = isAvailable ? 'ว่าง' : 'ไม่ว่าง';
                let Image_front = '';
                if (room.image_url_front) {
                    Image_front = room.image_url_front.split(',')[0];
                }

                grid.innerHTML += `
                    <div onclick="location.href='detail_rooms.html?id=${room.id}'" class="room-style">
                        <div class="room-image">
                            <img src="${Image_front}">
                        </div>
                        <div class="room-info">
                            <div class="room-detail">
                                <h4>ห้อง ${room.room_number}</h4>
                                <p class="room-price">${room.price}.- / เดือน</p>
                            </div>
                            <div class="status-badge ${statusClass}">
                                ${statusText}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        //  realtime
        _supabase
            .channel('public:rooms')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => fetchRooms())
            .subscribe();

        // use function    
        fetchRooms();
    </script>
</body>
