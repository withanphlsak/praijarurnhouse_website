<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบห้องว่าง - ไพรเจริญเฮาส์</title>
    <link rel="stylesheet" href="check.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <!-- navigation bar -->
    <nav class="navbar">
        <div class="logo-group">
            <a href="main.html">
                <img src="logo.png" class="logo-name">
            </a>
            <div class="name-dormitory">ไพรเจริญเฮาส์</div>
        </div>
        <div id="nav-links" class="nav-links">
            <a href="main.html" class="nav-link">หน้าหลัก</a>
            <a href="checkrooms.html" class="nav-link">ตรวจสอบห้องว่าง</a>
            <a href="guide.html" class="nav-link">คู่มือการจอง</a>
            <a href="contag.html" class="nav-link">ติดต่อเรา</a>
        </div>
        <!-- hamburger menu -->
        <button class="icon-hamburgerbar" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </button>
    </nav>

    <!-- โครงสร้างห้องทั้งหมดเเบบกำลังดึงข้อมูล -->
    <main class="container">
        <div class="header-part">
            <h2 class="header-title">ตรวจสอบห้องว่าง</h2>
            <p class="header-subtitle">* คลิกที่ห้องเพื่อดูรายละเอียด</p>
        </div>

        <div id="room-grid" class="room-grid">
            <p style="color: #9ca3af;">กำลังดึงข้อมูลจากระบบ...</p>
        </div>
    </main>

    <!-- footer -->
    <footer class="footer">
        <h3 class="tagline">
            ไพรเจริญเฮาส์
            <div class="linetag">
                <p>"fdsfsdfsdfdsfsd</p>
                <p>sdfdsfsdfsfsd"</p>
            </div>
        </h3>
        <h3 class="quick">
            Quick Links
            <div class="quick-links">
                <a href="main.html" class="link1">หน้าหลัก</a>
                <a href="checkrooms.html" class="link1">ตรวจสอบห้องว่าง</a>
                <a href="#" class="link1">คู่มือการจอง</a>
                <a href="#" class="link1">ติดต่อเรา</a>
            </div>
        </h3>
        <h3 class="connect">
            ช่องทางติดต่อ
            <div class="contag">
                <p>เบอร์โทร: 081-234-5678</p>
                <a href="">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/cd/Facebook_logo_%28square%29.png"
                        width="30" height="30">
                </a>
                <a href="">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/LINE_logo.svg/3840px-LINE_logo.svg.png?utm_source=th.wikisource.org&utm_campaign=index&utm_content=thumbnail"
                        width="30" height="30">
                </a>
            </div>
        </h3>
    </footer>



    <script>
        const socket = io();

        // ฟังก์ชันสำหรับแสดง/ซ่อนเมนูในมือถือ
        function myFunction() {
            let x = document.getElementById("nav-links");
            x.classList.toggle("show");
        }

        // ฟังก์ชันสำหรับดึงข้อมูลห้องจาก server
        async function fetchRooms() {
            try {
                const res = await fetch('/api/rooms');
                const rooms = await res.json();
                renderRooms(rooms);
            } catch (err) {
                console.error("เชื่อมต่อ server ไม่ได้:", err);
                document.getElementById('room-grid').innerHTML = '<p class="error-text">ไม่สามารถเชื่อมต่อ server ได้</p>';
            }
        }

        // ฟังก์ชันสำหรับแสดงข้อมูลห้องในรูปแบบgrid
        function renderRooms(rooms) {
            const grid = document.getElementById('room-grid');
            grid.innerHTML = '';

            rooms.forEach(room => {
                const isAvailable = room.status === 'available';
                const statusClass = isAvailable ? 'status-available' : 'status-occupied';
                const statusText = isAvailable ? 'ว่าง' : 'ไม่ว่าง';
                if (room.image_url_front) {
                    Image_front = room.image_url_front.split(',')[0];
                }

                grid.innerHTML += `
                    <div onclick="location.href='detail_rooms.html?id=${room.id}'" class="room-style">
                        <div class="room-image">
                            <img src="${Image_front}">
                        </div>
                        <div class="room-info">
                            <div class="room-detail">
                                <h4>ห้อง ${room.room_number}</h4>
                                <p class="room-price">${room.price}.- / เดือน</p>
                            </div>
                            <div class="status-badge ${statusClass}">
                                ${statusText}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // รับการอัปเดตสถานะห้องจากเซิร์ฟเวอร์
        socket.on('statusChange', () => fetchRooms());
        fetchRooms();
    </script>
</body>

</html>
