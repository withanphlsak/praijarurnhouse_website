<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="mng.css">
</head>

<body>
    <!-- ชื่อของเว็บ เเละ ตารางเเต่ละห้องในการเปลี่ยนสถานะ -->
    <h1 class="title-rooms">Manage Rooms</h1>
    <div class="manage-grid">
        กำลังโหลดข้อมูล..
    </div>
    <script>
        // setting
        const SUPABASE_URL = 'https://lttlapkgjfurwgzrfsjw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_oVzeeoFMXUBW47nCy-IpIQ_r8cKYVdP';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ฟังก์ชันสำหรับดึงข้อมูลห้องเเละเเสดงผล
        async function adminrooms() {
            try {
                const { data: rooms, error } = await _supabase
                    .from('rooms')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                const roomgrid = document.querySelector('.manage-grid');
                roomgrid.innerHTML = '';

                rooms.forEach(room => {
                    roomgrid.innerHTML += `
                        <div class="room">
                            <div>
                                <span class="number">ห้อง ${room.room_number}</span>
                                สถานะ: <span class="status-room">${room.status}</span>
                            </div>
                            <div class="button">
                                <button onclick="changeStatus(${room.id}, 'available')" class="bt-available">ว่าง</button>
                                <button onclick="changeStatus(${room.id}, 'occupied')" class="bt-occupied">ไม่ว่าง</button>
                            </div>
                        </div>
                        `;
                });
            } catch (err) {
                console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล:", err);
                document.querySelector('.manage-grid').innerText = "ไม่สามารถดึงข้อมูลได้";
            }
        };

        // ฟังก์ชันสำหรับเปลี่ยนสถานะห้องพัก
        async function changeStatus(roomId, newStatus) {
            try {
                const { error } = await _supabase
                    .from('rooms')
                    .update({ status: newStatus })
                    .eq('id', roomId);

                if (error) {
                    alert('อัปเดตสถานะไม่สำเร็จ: ' + error.message);
                } else {
                    adminrooms();
                }
            } catch (err) {
                console.error("เกิดข้อผิดพลาดในการอัปเดต:", err);
            }
        }

        // realtime
        _supabase
            .channel('public:rooms')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => adminrooms())
            .subscribe();

        // use function
        adminrooms();
    </script>
</body>

</html>
