<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดห้อง - ไพรเจริญเฮาส์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <!-- navigation bar -->
    <nav class="navbar">
        <span class="logo-name">ไพรเจริญเฮาส์</span>
        <div id="nav-links" class="nav-links">
            <a href="main.html" class="nav-link">หน้าหลัก</a>
            <a href="checkrooms.html" class="nav-link">ตรวจสอบห้องว่าง</a>
            <a href="#" class="nav-link">คู่มือการจอง</a>
            <a href="#" class="nav-link">ติดต่อเรา</a>
        </div>
        <!-- hamburger menu -->
        <button  class="icon-hamburgerbar" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </button>
    </nav>

    <!-- detail everything -->
    <section class="detail-container">
        <button onclick="location.href='checkrooms.html'" class="bt-back">
            ← กลับหน้าหลัก
        </button>

        <div class="detail-card">

            <div class="slideshow">
                <img id="room-image" src="" alt="room Photo" class="room-image">
                <div class="bt-lft-rth">
                    <button onclick="changeSlide(-1)" class="bt-left">❮</button>
                    <button onclick="changeSlide(1)" class="bt-right">❯</button>
                </div>

                <div id="image-counter" class="image-counter">1 / 3</div>
            </div>

            <div class="content">
                <h3 id="room-hook-data" class="room-hook">กำลังโหลดข้อมูล...</h3>
                <div id="status-content">
                    <!-- ข้อมูลปุ่มจองหรือสถานะจะมาแสดงที่นี่ -->
                </div>
            </div>
        </div>
    </section>

    <!-- เเสดงรูปเต็มตอนกดรูป -->
    <div id="imageModal" class="modal">
        <div class="all-black-modal">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img class="modal-content" id="fullImage">
            <div id="number-of-image" class="number-image"></div>
        </div>
    </div>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');
        let roomImages = [];
        let currentIndex = 0;

        // ฟังก์ชันสำหรับแสดง/ซ่อนเมนูในมือถือ
        function myFunction() {
            let x = document.getElementById("nav-links");
            x.classList.toggle("show");
        }

        // ฟังก์ชันดึงข้อมูลห้องและอัปเดตรายละเอียด
        async function updateView() {
            try {
                const res = await fetch('/api/rooms');
                const rooms = await res.json();
                const room = rooms.find(r => r.id == roomId);
                const content = document.getElementById('status-content');


                if (!room) {
                    document.getElementById('room-hook-data').innerText = "ไม่พบข้อมูลห้องพัก";
                    return;
                }

                document.getElementById('room-hook-data').innerText = `ห้อง ${room.room_number}`;

                if (room.image_url_slide) {
                    roomImages = room.image_url_slide.split(',');
                }

                Slide();

                if (room.status === 'available') {
                    content.innerHTML = `
                <div class="status-available">ตอนนี้ห้องว่าง</div>
                <h2 class="room-detail">รายละเอียดห้อง</h2>
                <a href="https://line.me" class="bt-line">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" class="line-icon">
                    ทักแชทสอบถาม (Line)
                </a>
            `;
                } else {
                    content.innerHTML = `
                <div class="status-occupied">
                    ขออภัย! ห้องนี้ไม่ว่าง
                </div>
            `;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ฟังก์ชันสำหรับแสดงสไลด์รูปภาพ
        function Slide() {
            const imgElement = document.getElementById('room-image'); 
            const counterElement = document.getElementById('image-counter');
            imgElement.src = `/images/${roomImages[currentIndex]}`;
            imgElement.onclick = openModal;
            imgElement.style.cursor = "zoom-in";

            if (imgElement) {
                
                imgElement.src = `${roomImages[currentIndex]}`;
            }

            if (counterElement) {
                counterElement.innerText = `${currentIndex + 1} / ${roomImages.length}`;
            }
        }

        // ฟังก์ชันเปลี่ยนรูปภาพในสไลด์
        function changeSlide(direction) {
            currentIndex += direction;

            if (currentIndex >= roomImages.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = roomImages.length - 1;

            Slide();
        }

        // ฟังก์ชันแสดงรูปภาพขนาดเต็ม
        function openModal() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("fullImage");
            const captionText = document.getElementById("number-of-image");
            const currentMainImg = document.getElementById('room-image'); 

            modal.style.display = "block";
            modalImg.src = currentMainImg.src;
            captionText.innerHTML = `รูปที่ ${currentIndex + 1} ของห้องนี้`;
        }

        // ฟังก์ชันปิดรูปเต็ม
        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        
        window.onclick = function (event) {
            const modal = document.getElementById("imageModal");
            if (event.target == modal) {
                closeModal();
            }
        }
        
        // บอกการอัปเดตสถานะห้องจากเซิร์ฟเวอร์
        socket.on('statusChanged', () => updateView());
        updateView();
    </script>
</body>

</html>
