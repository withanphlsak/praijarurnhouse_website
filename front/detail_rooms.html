<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดห้อง - ไพรเจริญเฮาส์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <!-- navigation bar -->
    <nav class="navbar">
        <div class="logo-group">
            <a href="main.html">
                <img src="logo.png" class="logo-name">
            </a>
            <div class="name-dormitory">ไพรเจริญเฮาส์</div>
        </div>
        <div id="nav-links" class="nav-links">
            <a href="main.html" class="nav-link">หน้าหลัก</a>
            <a href="checkrooms.html" class="nav-link">ตรวจสอบห้องว่าง</a>
            <a href="guide.html" class="nav-link">คู่มือการจอง</a>
            <a href="contag.html" class="nav-link">ติดต่อเรา</a>
        </div>
        <!-- hamburger menu -->
        <button class="icon-hamburgerbar" onclick="myFunction()">
            <i class="fa fa-bars"></i>
        </button>
    </nav>

    <!-- detail everything -->
    <section class="detail-container">
        <button onclick="location.href='checkrooms.html'" class="bt-back">
            ← กลับหน้าหลัก
        </button>

        <div class="detail-card">

            <div class="slideshow">
                <img id="room-image" src="" alt="room Photo" class="room-image">
                <div class="bt-lft-rth">
                    <button onclick="changeSlide(-1)" class="bt-left">❮</button>
                    <button onclick="changeSlide(1)" class="bt-right">❯</button>
                </div>

                <div id="image-counter" class="image-counter">1 / 3</div>
            </div>

            <div class="content">
                <h3 id="room-hook-data" class="room-hook">กำลังโหลดข้อมูล...</h3>
                <div id="status-content">
                    <!-- ข้อมูลปุ่มจองหรือสถานะจะมาแสดงที่นี่ -->
                </div>
            </div>
        </div>
    </section>

    <!-- เเสดงรูปเต็มตอนกดรูป -->
    <div id="imageModal" class="modal">
        <div class="all-black-modal">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img class="modal-content" id="fullImage">
            <div id="number-of-image" class="number-image"></div>
        </div>
    </div>

    <!-- footer -->
    <footer class="footer">
        <h3 class="tagline">
            ไพรเจริญเฮาส์
            <div class="linetag">
                <p>"อยู่เเบบกันเอง เเบบครอบครัว"</p>
            </div>
        </h3>
        <h3 class="quick">
            Quick Links
            <div class="quick-links">
                <a href="main.html" class="link1">หน้าหลัก</a>
                <a href="checkrooms.html" class="link1">ตรวจสอบห้องว่าง</a>
                <a href="guide.html" class="link1">คู่มือการจอง</a>
                <a href="contag.html" class="link1">ติดต่อเรา</a>
            </div>
        </h3>
        <h3 class="connect">
            ช่องทางติดต่อ
            <div class="contag">
                <p>เบอร์โทร: 061-945-4607</p>
                <a href="https://www.facebook.com/share/1CTJEUi93m/">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/cd/Facebook_logo_%28square%29.png"
                        width="30" height="30">
                </a>
                <a href="https://line.me/ti/p/9bOdqbhh_V?fbclid=IwY2xjawR-qlxleHRuA2FlbQIxMABicmlkETFpQ3dhcVVRZmY4VkY0c1k5c3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHrIVCooQ7IrrwvQq8WtrCRQUauX3rkUcOAVRbU_obEtxnFwaplDQmqt-NCPW_aem_MoxFYTwrvCf82DD0p4K3Rg">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/LINE_logo.svg/3840px-LINE_logo.svg.png?utm_source=th.wikisource.org&utm_campaign=index&utm_content=thumbnail"
                        width="30" height="30">
                </a>
            </div>
        </h3>
    </footer>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');
        let roomImages = [];
        let currentIndex = 0;

        // ฟังก์ชันสำหรับแสดง/ซ่อนเมนูในมือถือ
        function myFunction() {
            let x = document.getElementById("nav-links");
            x.classList.toggle("show");
        }

        // ฟังก์ชันดึงข้อมูลห้องและอัปเดตรายละเอียด
        async function updateView() {
            try {
                const res = await fetch('/api/rooms');
                const rooms = await res.json();
                const room = rooms.find(r => r.id == roomId);
                const content = document.getElementById('status-content');


                if (!room) {
                    document.getElementById('room-hook-data').innerText = "ไม่พบข้อมูลห้องพัก";
                    return;
                }

                document.getElementById('room-hook-data').innerText = `ห้อง ${room.room_number}`;

                if (room.image_url_slide) {
                    roomImages = room.image_url_slide.split(',');
                }

                Slide();

                if (room.status === 'available') {
                    content.innerHTML = `
                <div class="status-available">ตอนนี้ห้องว่าง</div>
                <h2 class="room-detail">รายละเอียดห้อง</h2>
                <h3 class="room-detail-all">${room.detail}</h3>
                <a href="https://line.me/ti/p/9bOdqbhh_V?fbclid=IwY2xjawR-qlxleHRuA2FlbQIxMABicmlkETFpQ3dhcVVRZmY4VkY0c1k5c3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHrIVCooQ7IrrwvQq8WtrCRQUauX3rkUcOAVRbU_obEtxnFwaplDQmqt-NCPW_aem_MoxFYTwrvCf82DD0p4K3Rg" class="bt-line">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" class="line-icon">
                    ทักไลน์สอบถาม (Line)
                </a>
                <a href="https://www.facebook.com/share/1CTJEUi93m/" class="bt-facebook">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/cd/Facebook_logo_%28square%29.png" class="face-icon">
                    ทักเพจสอบถาม (facebook)
                </a>
            `;
                } else {
                    content.innerHTML = `
                <div class="status-occupied">
                    ขออภัย! ห้องนี้ไม่ว่าง
                </div>
            `;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ฟังก์ชันสำหรับแสดงสไลด์รูปภาพ
        function Slide() {
            const imgElement = document.getElementById('room-image');
            const counterElement = document.getElementById('image-counter');
            imgElement.src = `/images/${roomImages[currentIndex]}`;
            imgElement.onclick = openModal;
            imgElement.style.cursor = "zoom-in";

            if (imgElement) {

                imgElement.src = `${roomImages[currentIndex]}`;
            }

            if (counterElement) {
                counterElement.innerText = `${currentIndex + 1} / ${roomImages.length}`;
            }
        }

        // ฟังก์ชันเปลี่ยนรูปภาพในสไลด์
        function changeSlide(direction) {
            currentIndex += direction;

            if (currentIndex >= roomImages.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = roomImages.length - 1;

            Slide();
        }

        // ฟังก์ชันแสดงรูปภาพขนาดเต็ม
        function openModal() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("fullImage");
            const captionText = document.getElementById("number-of-image");
            const currentMainImg = document.getElementById('room-image');

            modal.style.display = "block";
            modalImg.src = currentMainImg.src;
            captionText.innerHTML = `รูปที่ ${currentIndex + 1} ของห้องนี้`;
        }

        // ฟังก์ชันปิดรูปเต็ม
        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        // ฟังก์ชันปิด modal เมื่อคลิกนอกภาพ
        window.onclick = function (event) {
            const modal = document.getElementById("imageModal");
            if (event.target == modal) {
                closeModal();
            }
        }

        // บอกการอัปเดตสถานะห้องจากเซิร์ฟเวอร์
        socket.on('statusChanged', () => updateView());
        updateView();
    </script>
</body>

</html>
